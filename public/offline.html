<!doctype html>
<!--
  Service-worker offline fallback (app/sw.ts) — shown only when BOTH the
  network and this device's own cache have nothing for the requested page
  (a route never opened online before, now requested while offline). Kept
  as a plain static file (not a Next.js route) deliberately: files in
  public/ are what @serwist/next's build plugin auto-precaches, so this is
  guaranteed available offline from the very first app install onward,
  with no dependency on the page it's a fallback FOR ever having loaded
  successfully first.
-->
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MedTracking — Εκτός σύνδεσης</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #71717a;
        --accent: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --accent: #fafafa;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 28rem;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        min-height: 48px;
        padding: 0 1.5rem;
        border-radius: 9999px;
        border: none;
        background: var(--accent);
        color: var(--bg);
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Δεν έχετε συνδεθεί ακόμα σε αυτή τη σελίδα</h1>
    <p>
      Είστε εκτός σύνδεσης και αυτή η σελίδα δεν έχει ανοίξει ξανά σε αυτή τη συσκευή. Συνδεθείτε στο διαδίκτυο μία
      φορά για να τη φορτώσετε — μετά θα είναι διαθέσιμη και εκτός σύνδεσης.
    </p>
    <button type="button" onclick="location.reload()">Δοκιμή ξανά</button>
  </body>
</html>
